name: flutter_easy_cache
description: "A don't overthink it, easy-to-use caching layer for Flutter."
version: 0.2.0
repository: https://github.com/chadpav/flutter_easy_cache

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5           # https://pub.dev/packages/shared_preferences/changelog
  shared_preferences_platform_interface: ^2.4.2
  flutter_secure_storage: ^10.3.1      # https://pub.dev/packages/flutter_secure_storage/changelog

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

